<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Somnia Swap</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    body {
      font-family: "Inter", Arial, sans-serif;
      background: #0d1117;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .swap-box {
      background: #161b22;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 380px;
    }
    .swap-box h2 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 20px;
    }
    .field { margin-bottom: 12px; }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
    }
    select {
      background: #21262d;
      color: #fff;
    }
    input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
    }
    .swap-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      background: #238636;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #2ea043; }
    .switch-btn {
      background: #30363d;
      font-size: 18px;
    }
    #quote {
      margin-top: 12px;
      font-size: 14px;
      color: #9ca3af;
      white-space: pre-line;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="swap-box">
    <h2>Somnia Swap</h2>

    <div class="field">
      <select id="pairSelect" onchange="updateQuote()">
        <option value="STT_USSD">STT ↔ USSD</option>
        <option value="GX_USSD">GX ↔ USSD</option>
      </select>
    </div>

    <div class="field">
      <input id="amountIn" type="number" placeholder="Amount in (Token A)" oninput="updateQuote()" />
    </div>

    <div class="swap-actions">
      <button onclick="connectSpecificWallet('metamask')">Connect</button>
      <button class="switch-btn" onclick="switchDirection()">⇅</button>
      <button onclick="doSwap()">Swap</button>
    </div>

    <div id="quote">💡 Output: --</div>
    <div id="status"></div>
  </div>

  <script>
    /* ========= Load ABI ========= */
    let AMMPairABI = null;
    fetch("assets/js/abi/AMMPair.json")
      .then(r => r.json())
      .then(data => {
        AMMPairABI = data;
        console.log("✅ AMMPair ABI loaded", AMMPairABI);
      })
      .catch(err => console.error("❌ Failed to load ABI:", err));

    /* ========= Config ========= */
    const RPC_URL = "https://dream-rpc.somnia.network/";
    let provider, signer, userAddress, connectedWalletType = null;
    let swapDirection = "AtoB"; // track swap direction

    const PAIRS_CONFIG = {
      STT_USSD: {
        name: 'STT/USSD',
        ROUTER_ADDRESS: "0xEd03899F0804B5BD49a06192f22900f89F3EC019",
        PAIR_ADDRESS: "0x81001f1e0fC4aBB1F76444AFeEb148Bc8d1F9118",
        TOKEN_A: { address: "0xF22eF0085f6511f70b01a68F360dCc56261F768a", symbol: "STT", decimals: 18 },
        TOKEN_B: { address: "0x22d33Bf4e4076C018539bEBD7213A505fa980676", symbol: "USSD", decimals: 18 }
      },
      GX_USSD: {
        name: 'GX/USSD',
        ROUTER_ADDRESS: "0xb04116B49E34078b35468205982e5CD1B6d566F7",
        PAIR_ADDRESS: "0x7b22883D5ca7443eC45325CfF7BEdAD49BcC2110",
        TOKEN_A: { address: "0xd0c6db65b4B6Fd9B0FF325520A30c2aa726133f2", symbol: "GX", decimals: 18 },
        TOKEN_B: { address: "0x22d33Bf4e4076C018539bEBD7213A505fa980676", symbol: "USSD", decimals: 18 }
      }
    };

    const ERC20_ABI = ["function approve(address spender, uint256 amount) external returns (bool)"];
    const ROUTER_ABI = [
      "function swapExactTokensForTokens(uint amountIn, uint amountOutMin, address tokenIn, address tokenOut, address to) external returns (uint[] memory amounts)"
    ];

    /* ========= Wallet ========= */
    async function connectSpecificWallet(walletType) {
      try {
        let ethereum = window.ethereum?.providers?.find(p => p.isMetaMask) || window.ethereum;
        if (!ethereum) throw new Error('MetaMask not found');

        await ethereum.request({ method: 'eth_requestAccounts' });
        provider = new ethers.providers.Web3Provider(ethereum);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        connectedWalletType = walletType;

        document.getElementById("status").innerText = `✅ Connected: ${userAddress}`;
      } catch (err) {
        document.getElementById("status").innerText = "❌ " + err.message;
      }
    }

    /* ========= Quote ========= */
    async function updateQuote() {
      try {
        if (!AMMPairABI) {
          console.warn("[updateQuote] ABI not loaded yet.");
          return;
        }

        const pairKey = document.getElementById("pairSelect").value;
        const config = PAIRS_CONFIG[pairKey];
        const amountIn = document.getElementById("amountIn").value;

        if (!amountIn || amountIn <= 0) {
          document.getElementById("quote").innerText = "💡 Output: --";
          return;
        }

        const rpc = new ethers.providers.JsonRpcProvider(RPC_URL);
        const pair = new ethers.Contract(config.PAIR_ADDRESS, AMMPairABI, rpc);

        const [reserve0, reserve1] = await pair.getReserves();
        const token0 = await pair.token0();

        let reserveA, reserveB, tokenIn, tokenOut;
        if (config.TOKEN_A.address.toLowerCase() === token0.toLowerCase()) {
          reserveA = reserve0; reserveB = reserve1;
        } else {
          reserveA = reserve1; reserveB = reserve0;
        }

        if (swapDirection === "AtoB") {
          tokenIn = config.TOKEN_A;
          tokenOut = config.TOKEN_B;
        } else {
          tokenIn = config.TOKEN_B;
          tokenOut = config.TOKEN_A;
          [reserveA, reserveB] = [reserveB, reserveA];
        }

        const amountInWei = ethers.utils.parseUnits(amountIn, tokenIn.decimals);
        const amountOutWei = reserveB.mul(amountInWei).div(reserveA.add(amountInWei));
        const amountOut = ethers.utils.formatUnits(amountOutWei, tokenOut.decimals);

        const priceAinB = parseFloat(ethers.utils.formatUnits(reserveB, tokenOut.decimals)) /
                          parseFloat(ethers.utils.formatUnits(reserveA, tokenIn.decimals));

        document.getElementById("quote").innerText =
          `💡 ${amountIn} ${tokenIn.symbol} ≈ ${amountOut} ${tokenOut.symbol}\n` +
          `1 ${tokenIn.symbol} ≈ ${priceAinB.toFixed(6)} ${tokenOut.symbol}`;
      } catch (err) {
        console.error("[updateQuote] Error:", err);
        document.getElementById("quote").innerText = "⚠️ Price unavailable";
      }
    }

    /* ========= Swap ========= */
    async function doSwap() {
      try {
        const pairKey = document.getElementById("pairSelect").value;
        const config = PAIRS_CONFIG[pairKey];
        const amountIn = document.getElementById("amountIn").value;
        if (!signer) throw new Error("Wallet not connected");
        if (!amountIn || amountIn <= 0) throw new Error("Enter valid amount");

        let tokenIn, tokenOut;
        if (swapDirection === "AtoB") {
          tokenIn = config.TOKEN_A;
          tokenOut = config.TOKEN_B;
        } else {
          tokenIn = config.TOKEN_B;
          tokenOut = config.TOKEN_A;
        }

        const amountInWei = ethers.utils.parseUnits(amountIn, tokenIn.decimals);

        const tokenContract = new ethers.Contract(tokenIn.address, ERC20_ABI, signer);
        let tx = await tokenContract.approve(config.ROUTER_ADDRESS, amountInWei);
        await tx.wait();

        const router = new ethers.Contract(config.ROUTER_ADDRESS, ROUTER_ABI, signer);
        tx = await router.swapExactTokensForTokens(
          amountInWei,
          0,
          tokenIn.address,
          tokenOut.address,
          userAddress
        );
        await tx.wait();

        document.getElementById("status").innerText =
          `✅ Swapped ${amountIn} ${tokenIn.symbol} → ${tokenOut.symbol}`;
      } catch (err) {
        document.getElementById("status").innerText = "❌ " + err.message;
      }
    }

    /* ========= Direction Toggle ========= */
    function switchDirection() {
      swapDirection = swapDirection === "AtoB" ? "BtoA" : "AtoB";
      updateQuote();
    }
  </script>
</body>
</html>
