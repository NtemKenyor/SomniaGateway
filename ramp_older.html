<div class="tab-content active" id="ramp">
    <style>
      :root {
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --success-color: #10b981;
        --error-color: #ef4444;
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.15);
      }
  
      .ramp-container {
        max-width: 460px;
        margin: 2rem auto;
      }
  
      .ramp-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 1.5rem;
        backdrop-filter: blur(20px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      }
  
      .ramp-title {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        text-align: center;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
  
      /* Form groups */
      .form-group {
        margin-bottom: 1.25rem;
      }
  
      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
      }
  
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.75rem;
        border-radius: 12px;
        border: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.05);
        color: white;
        font-size: 1rem;
      }
  
      /* Toggle buttons */
      .toggle-group {
        display: flex;
        margin-bottom: 1.5rem;
      }
  
      .toggle-btn {
        flex: 1;
        text-align: center;
        padding: 0.8rem;
        border: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.05);
        color: white;
        cursor: pointer;
        transition: background 0.3s ease;
      }
  
      .toggle-btn.active {
        background: var(--primary-gradient);
        font-weight: bold;
      }
  
      /* Main button */
      .btn-ramp {
        width: 100%;
        background: var(--primary-gradient);
        color: white;
        border: none;
        padding: 0.8rem;
        border-radius: 12px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.3s ease;
      }
  
      .btn-ramp:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }
  
      /* Status */
      .ramp-status {
        margin-top: 1rem;
        font-size: 0.95rem;
        font-weight: 500;
        text-align: center;
      }
  
      .ramp-status.success {
        color: var(--success-color);
      }
  
      .ramp-status.error {
        color: var(--error-color);
      }
    </style>
  
    <div class="ramp-container">
      <div class="ramp-card">
        <h3 class="ramp-title">💳 Fiat On/Off Ramp</h3>
  
        <!-- Toggle Buy/Sell -->
        <div class="toggle-group">
          <div class="toggle-btn active" id="buyBtn">Buy Crypto</div>
          <div class="toggle-btn" id="sellBtn">Sell Crypto</div>
        </div>
  
        <!-- Form -->
        <form id="rampForm">
          <div class="form-group">
            <label for="fiatAmount">Amount (Fiat)</label>
            <input type="number" id="fiatAmount" placeholder="Enter amount" required />
          </div>
  
          <div class="form-group">
            <label for="fiatCurrency">Currency</label>
            <select id="fiatCurrency">
              <option value="NGN">NGN</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
            </select>
          </div>
  
          <div class="form-group">
            <label for="cryptoToken">Token</label>
            <select id="cryptoToken">
              <option value="ETH">ETH</option>
              <option value="USDC">USDC</option>
              <option value="BTC">BTC</option>
            </select>
          </div>
  
          <button type="submit" class="btn-ramp" id="checkoutBtn">Checkout</button>
          <div id="rampStatus" class="ramp-status"></div>
        </form>
      </div>
    </div>
  
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const buyBtn = document.getElementById("buyBtn");
        const sellBtn = document.getElementById("sellBtn");
        const rampForm = document.getElementById("rampForm");
        const rampStatus = document.getElementById("rampStatus");
        let mode = "buy"; // default
  
        // Toggle Buy/Sell
        buyBtn.addEventListener("click", () => {
          mode = "buy";
          buyBtn.classList.add("active");
          sellBtn.classList.remove("active");
        });
  
        sellBtn.addEventListener("click", () => {
          mode = "sell";
          sellBtn.classList.add("active");
          buyBtn.classList.remove("active");
        });
  
        // Handle checkout
        rampForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const fiatAmount = document.getElementById("fiatAmount").value;
          const fiatCurrency = document.getElementById("fiatCurrency").value;
          const cryptoToken = document.getElementById("cryptoToken").value;
  
          if (!fiatAmount || fiatAmount <= 0) {
            rampStatus.textContent = "❌ Enter a valid fiat amount.";
            rampStatus.className = "ramp-status error";
            return;
          }
  
          rampStatus.textContent = "⏳ Redirecting to payment gateway...";
          rampStatus.className = "ramp-status";
  
          setTimeout(() => {
            if (mode === "buy") {
              rampStatus.textContent = `✅ Payment successful! You bought ${cryptoToken} worth ${fiatAmount} ${fiatCurrency}.`;
            } else {
              rampStatus.textContent = `✅ Sell successful! You received ${fiatAmount} ${fiatCurrency} for your ${cryptoToken}.`;
            }
            rampStatus.className = "ramp-status success";
          }, 1500);
        });
      });
    </script>
  </div>
