    async function connectSpecificWallet(walletType) {
      try {
        let ethereum = window.ethereum;
        if (walletType === 'metamask') {
          ethereum = window.ethereum?.providers?.find(p => p.isMetaMask) || window.ethereum;
        }
        if (!ethereum) throw new Error('MetaMask not found');

        await ethereum.request({ method: 'eth_requestAccounts' });
        provider = new ethers.providers.Web3Provider(ethereum);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        connectedWalletType = walletType;

        document.getElementById("status").innerText = `✅ Connected: ${userAddress}`;
      } catch (err) {
        document.getElementById("status").innerText = "❌ " + err.message;
      }
    }

    async function updateQuote() {
      try {
        const pairKey = document.getElementById("pairSelect").value;
        const config = PAIRS_CONFIG[pairKey];
        const amountIn = document.getElementById("amountIn").value;

        if (!amountIn || amountIn <= 0) {
          document.getElementById("quote").innerText = "💡 Output: --";
          console.log("[updateQuote] No input amount provided");
          return;
        }

        console.log(`\n[updateQuote] Pair selected: ${config.name}`);
        console.log(`[updateQuote] Input amount: ${amountIn} ${config.TOKEN_A.symbol}`);

        const rpc = new ethers.providers.JsonRpcProvider("https://dream-rpc.somnia.network/");
        const pair = new ethers.Contract(config.PAIR_ADDRESS, DEMO_PAIR_ABI, rpc);

        let reserves;
        try {
          reserves = await pair.getReserves();
        } catch (err) {
          console.error("[updateQuote] getReserves() failed:", err);
          const raw = await rpc.call({
            to: config.PAIR_ADDRESS,
            data: pair.interface.encodeFunctionData("getReserves", [])
          });
          console.log("[updateQuote] Raw getReserves data:", raw);
          document.getElementById("quote").innerText = "⚠️ getReserves() failed";
          return;
        }

        const [reserve0, reserve1] = reserves;
        const token0 = await pair.token0();
        const token1 = await pair.token1();

        console.log(`[updateQuote] token0: ${token0}`);
        console.log(`[updateQuote] token1: ${token1}`);
        console.log(`[updateQuote] raw reserves:`, reserve0.toString(), reserve1.toString());

        let reserveA, reserveB;
        if (config.TOKEN_A.address.toLowerCase() === token0.toLowerCase()) {
          reserveA = reserve0;
          reserveB = reserve1;
        } else {
          reserveA = reserve1;
          reserveB = reserve0;
        }

        const rA = parseFloat(ethers.utils.formatUnits(reserveA, config.TOKEN_A.decimals));
        const rB = parseFloat(ethers.utils.formatUnits(reserveB, config.TOKEN_B.decimals));
        console.log(`[updateQuote] normalized reserves: ${rA} ${config.TOKEN_A.symbol}, ${rB} ${config.TOKEN_B.symbol}`);

        const amountInWei = ethers.utils.parseUnits(amountIn, config.TOKEN_A.decimals);
        const amountOutWei = reserveB.mul(amountInWei).div(reserveA.add(amountInWei));
        const amountOut = ethers.utils.formatUnits(amountOutWei, config.TOKEN_B.decimals);

        console.log(`[updateQuote] amountInWei=${amountInWei.toString()}`);
        console.log(`[updateQuote] amountOutWei=${amountOutWei.toString()}`);
        console.log(`[updateQuote] formatted output: ${amountOut} ${config.TOKEN_B.symbol}`);

        const priceAinB = rB / rA;
        const priceBinA = rA / rB;

        document.getElementById("quote").innerText =
          `💡 ${amountIn} ${config.TOKEN_A.symbol} ≈ ${amountOut} ${config.TOKEN_B.symbol}\n` +
          `1 ${config.TOKEN_A.symbol} ≈ ${priceAinB.toFixed(6)} ${config.TOKEN_B.symbol}\n` +
          `1 ${config.TOKEN_B.symbol} ≈ ${priceBinA.toFixed(6)} ${config.TOKEN_A.symbol}`;
      } catch (err) {
        console.error("[updateQuote] Unexpected error:", err);
        document.getElementById("quote").innerText = "⚠️ Price unavailable";
      }
    }

    async function doSwap() {
      try {
        const pairKey = document.getElementById("pairSelect").value;
        const config = PAIRS_CONFIG[pairKey];
        const amountIn = document.getElementById("amountIn").value;

        if (!signer) throw new Error("Wallet not connected");
        if (!amountIn || amountIn <= 0) throw new Error("Enter valid amount");

        const amountInWei = ethers.utils.parseUnits(amountIn, config.TOKEN_A.decimals);

        const tokenA = new ethers.Contract(config.TOKEN_A.address, ERC20_ABI, signer);
        let tx = await tokenA.approve(config.ROUTER_ADDRESS, amountInWei);
        await tx.wait();

        const router = new ethers.Contract(config.ROUTER_ADDRESS, ROUTER_ABI, signer);
        tx = await router.swapExactTokensForTokens(
          amountInWei,
          0,
          config.TOKEN_A.address,
          config.TOKEN_B.address,
          userAddress
        );
        await tx.wait();

        document.getElementById("status").innerText =
          `✅ Swapped ${amountIn} ${config.TOKEN_A.symbol} → ${config.TOKEN_B.symbol}`;
      } catch (err) {
        document.getElementById("status").innerText = "❌ " + err.message;
      }
    }
